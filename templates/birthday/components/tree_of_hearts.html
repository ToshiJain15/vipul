<!-- The Romantic Tree of Hearts (Midnight Wine & Rose Gold Theme) -->
<section id="tree-section" class="py-20 px-4 relative z-20">
    <div class="max-w-5xl mx-auto space-y-10 text-center">
        
        <div class="space-y-3">
            <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-rose-500/20 border border-rose-400/30 text-rose-300 text-xs font-semibold backdrop-blur">
                <span>🌳💖</span>
                <span class="tracking-widest uppercase font-cinzel">The Tree of Love</span>
                <span>✨</span>
            </div>
            <h2 class="font-serif text-3xl sm:text-5xl font-bold text-white">Our Tree of Hearts 🌳❤️</h2>
            <p class="text-rose-200/80 text-sm sm:text-base max-w-xl mx-auto">
                Every blossoming branch holds a secret promise of our forever love. Tap any glowing heart jewel to unveil its message!
            </p>
        </div>

        <!-- The Interactive Tree Canvas/SVG Container -->
        <div class="glass-panel rounded-3xl p-6 sm:p-10 border border-rose-500/30 shadow-2xl relative overflow-hidden select-none">
            
            <!-- Soft Ambient Backlight -->
            <div class="absolute inset-0 bg-gradient-to-t from-rose-950/40 via-transparent to-amber-950/20 pointer-events-none"></div>

            <div class="relative w-full max-w-2xl mx-auto aspect-[4/3] flex items-center justify-center">
                
                <!-- Beautiful Blossoming Tree SVG -->
                <svg viewBox="0 0 800 600" class="w-full h-full filter drop-shadow-[0_10px_25px_rgba(0,0,0,0.5)]">
                    <defs>
                        <!-- Trunk Gradient (Rich Deep Rosewood) -->
                        <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#4a1525" />
                            <stop offset="50%" stop-color="#300d17" />
                            <stop offset="100%" stop-color="#1a050d" />
                        </linearGradient>

                        <!-- Foliage Soft Blush Gradient -->
                        <radialGradient id="foliageGrad1" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#fda4af" stop-opacity="0.35" />
                            <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.2" />
                            <stop offset="100%" stop-color="#e11d48" stop-opacity="0" />
                        </radialGradient>
                        <radialGradient id="foliageGrad2" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.4" />
                            <stop offset="60%" stop-color="#fb7185" stop-opacity="0.22" />
                            <stop offset="100%" stop-color="#be123c" stop-opacity="0" />
                        </radialGradient>
                    </defs>

                    <!-- Soft Blossoming Foliage Clouds -->
                    <circle cx="400" cy="220" r="170" fill="url(#foliageGrad1)" />
                    <circle cx="280" cy="250" r="130" fill="url(#foliageGrad2)" />
                    <circle cx="520" cy="250" r="130" fill="url(#foliageGrad2)" />
                    <circle cx="340" cy="150" r="110" fill="url(#foliageGrad1)" />
                    <circle cx="460" cy="150" r="110" fill="url(#foliageGrad2)" />

                    <!-- Tree Roots & Ground Mound -->
                    <ellipse cx="400" cy="565" rx="220" ry="25" fill="#200a12" opacity="0.6" />
                    <ellipse cx="400" cy="560" rx="160" ry="16" fill="#380e1a" opacity="0.8" />

                    <!-- Sculpted Tree Trunk & Branches -->
                    <path d="M 370 560 
                             C 375 460, 350 400, 340 330
                             C 325 280, 270 260, 220 250
                             C 240 265, 290 290, 335 345
                             C 345 365, 355 450, 360 560 Z" 
                          fill="url(#trunkGrad)" />

                    <path d="M 430 560 
                             C 425 460, 450 400, 460 330
                             C 475 280, 530 260, 580 250
                             C 560 265, 510 290, 465 345
                             C 455 365, 445 450, 440 560 Z" 
                          fill="url(#trunkGrad)" />

                    <!-- Central Stem and Canopy Branches -->
                    <path d="M 380 430 
                             C 385 360, 390 300, 400 230
                             C 370 190, 330 170, 290 160
                             C 325 180, 360 210, 390 250
                             C 395 210, 400 170, 400 110
                             C 405 170, 410 210, 415 250
                             C 445 210, 480 180, 515 160
                             C 475 170, 435 190, 405 230
                             C 415 300, 420 360, 425 430 Z" 
                          fill="url(#trunkGrad)" />

                    <!-- Elegant Branch Swirls -->
                    <path d="M 345 345 C 310 320, 260 320, 210 330 C 240 340, 280 345, 335 360 Z" fill="url(#trunkGrad)" />
                    <path d="M 460 345 C 495 320, 545 320, 595 330 C 565 340, 525 345, 470 360 Z" fill="url(#trunkGrad)" />

                    <!-- Carved Heart with "V + T" Initials on Trunk -->
                    <g transform="translate(400, 465)">
                        <path d="M 0 10 
                                 C -16 -12, -32 5, 0 32 
                                 C 32 5, 16 -12, 0 10 Z" 
                              fill="#6b1d2e" stroke="#cca048" stroke-width="2" />
                        <text x="0" y="18" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#fde047" text-anchor="middle">
                            V + T
                        </text>
                    </g>
                </svg>

                <!-- 8 Interactive Glowing Heart Jewels Positioned Across Blossoms -->
                <!-- Heart 1: Top Center -->
                <button type="button" class="tree-heart-btn absolute top-[14%] left-[48%] -translate-x-1/2 group" data-index="0" title="Tap to open!">
                    <span class="tree-heart-pulsar block text-3xl sm:text-4xl filter drop-shadow-[0_0_12px_rgba(244,63,94,0.9)]">❤️</span>
                    <span class="opacity-0 group-hover:opacity-100 transition absolute -bottom-5 left-1/2 -translate-x-1/2 text-[10px] font-cinzel font-bold text-amber-200 bg-black/80 px-2 py-0.5 rounded whitespace-nowrap border border-amber-300/40">Our Forever</span>
                </button>

                <!-- Heart 2: Top Left Branch -->
                <button type="button" class="tree-heart-btn absolute top-[22%] left-[32%] group" data-index="1" title="Tap to open!">
                    <span class="tree-heart-pulsar block text-3xl sm:text-4xl filter drop-shadow-[0_0_12px_rgba(251,113,133,0.9)]" style="animation-delay: 0.4s;">💖</span>
                    <span class="opacity-0 group-hover:opacity-100 transition absolute -bottom-5 left-1/2 -translate-x-1/2 text-[10px] font-cinzel font-bold text-amber-200 bg-black/80 px-2 py-0.5 rounded whitespace-nowrap border border-amber-300/40">Distance Means Nothing</span>
                </button>

                <!-- Heart 3: Top Right Branch -->
                <button type="button" class="tree-heart-btn absolute top-[22%] right-[32%] group" data-index="2" title="Tap to open!">
                    <span class="tree-heart-pulsar block text-3xl sm:text-4xl filter drop-shadow-[0_0_12px_rgba(223,188,120,0.9)]" style="animation-delay: 0.8s;">💛</span>
                    <span class="opacity-0 group-hover:opacity-100 transition absolute -bottom-5 left-1/2 -translate-x-1/2 text-[10px] font-cinzel font-bold text-amber-200 bg-black/80 px-2 py-0.5 rounded whitespace-nowrap border border-amber-300/40">Your Voice</span>
                </button>

                <!-- Heart 4: Far Left Blossom -->
                <button type="button" class="tree-heart-btn absolute top-[36%] left-[20%] group" data-index="3" title="Tap to open!">
                    <span class="tree-heart-pulsar block text-3xl sm:text-4xl filter drop-shadow-[0_0_12px_rgba(244,63,94,0.9)]" style="animation-delay: 1.2s;">🛵</span>
                    <span class="opacity-0 group-hover:opacity-100 transition absolute -bottom-5 left-1/2 -translate-x-1/2 text-[10px] font-cinzel font-bold text-amber-200 bg-black/80 px-2 py-0.5 rounded whitespace-nowrap border border-amber-300/40">Scooty Breeze</span>
                </button>

                <!-- Heart 5: Far Right Blossom -->
                <button type="button" class="tree-heart-btn absolute top-[36%] right-[20%] group" data-index="4" title="Tap to open!">
                    <span class="tree-heart-pulsar block text-3xl sm:text-4xl filter drop-shadow-[0_0_12px_rgba(251,113,133,0.9)]" style="animation-delay: 1.6s;">🛡️</span>
                    <span class="opacity-0 group-hover:opacity-100 transition absolute -bottom-5 left-1/2 -translate-x-1/2 text-[10px] font-cinzel font-bold text-amber-200 bg-black/80 px-2 py-0.5 rounded whitespace-nowrap border border-amber-300/40">Safe Haven</span>
                </button>

                <!-- Heart 6: Center Cluster -->
                <button type="button" class="tree-heart-btn absolute top-[38%] left-[47%] -translate-x-1/2 group" data-index="5" title="Tap to open!">
                    <span class="tree-heart-pulsar block text-4xl sm:text-5xl filter drop-shadow-[0_0_16px_rgba(223,188,120,0.95)]" style="animation-delay: 2s;">✨</span>
                    <span class="opacity-0 group-hover:opacity-100 transition absolute -bottom-5 left-1/2 -translate-x-1/2 text-[10px] font-cinzel font-bold text-amber-200 bg-black/80 px-2 py-0.5 rounded whitespace-nowrap border border-amber-300/40">Golden Heart</span>
                </button>

                <!-- Heart 7: Lower Left -->
                <button type="button" class="tree-heart-btn absolute top-[48%] left-[30%] group" data-index="6" title="Tap to open!">
                    <span class="tree-heart-pulsar block text-3xl sm:text-4xl filter drop-shadow-[0_0_12px_rgba(244,63,94,0.9)]" style="animation-delay: 2.4s;">💍</span>
                    <span class="opacity-0 group-hover:opacity-100 transition absolute -bottom-5 left-1/2 -translate-x-1/2 text-[10px] font-cinzel font-bold text-amber-200 bg-black/80 px-2 py-0.5 rounded whitespace-nowrap border border-amber-300/40">21 Dec 2026</span>
                </button>

                <!-- Heart 8: Lower Right -->
                <button type="button" class="tree-heart-btn absolute top-[48%] right-[30%] group" data-index="7" title="Tap to open!">
                    <span class="tree-heart-pulsar block text-3xl sm:text-4xl filter drop-shadow-[0_0_12px_rgba(251,113,133,0.9)]" style="animation-delay: 2.8s;">🏡</span>
                    <span class="opacity-0 group-hover:opacity-100 transition absolute -bottom-5 left-1/2 -translate-x-1/2 text-[10px] font-cinzel font-bold text-amber-200 bg-black/80 px-2 py-0.5 rounded whitespace-nowrap border border-amber-300/40">Our Tomorrow</span>
                </button>

            </div>

            <p class="text-xs text-rose-300/70 mt-4 italic font-medium">
                Tap on any heart leaf or symbol in the tree to read its promise!
            </p>
        </div>

    </div>

    <!-- Tree Promise Modal -->
    <div id="tree-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full p-6 sm:p-8 rounded-3xl border border-rose-400/50 shadow-2xl space-y-4 text-center relative animate-float">
            <!-- Close Button -->
            <button type="button" id="close-tree-modal" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-rose-500/20 hover:bg-rose-500/40 text-rose-200 flex items-center justify-center text-sm font-bold transition">
                ✕
            </button>

            <!-- Emoji Header -->
            <div id="modal-tree-emoji" class="text-5xl animate-bounce pt-2">💖</div>

            <div class="space-y-1">
                <span class="text-[10px] uppercase tracking-widest text-amber-300 font-cinzel font-bold">Secret Promise</span>
                <h3 id="modal-tree-title" class="font-serif text-2xl font-bold text-white">Our Forever Promise</h3>
            </div>

            <div class="p-4 rounded-2xl bg-black/50 border border-rose-500/30 text-rose-100 text-xs sm:text-sm leading-relaxed shadow-inner">
                <p id="modal-tree-message">Loading message...</p>
            </div>

            <button type="button" id="close-tree-modal-btn" class="w-full py-3 rounded-full bg-gradient-to-r from-rose-600 to-rose-500 hover:from-rose-500 hover:to-rose-400 text-white font-medium text-xs sm:text-sm shadow-md transition">
                Cherish This Promise ❤️
            </button>
        </div>
    </div>
</section>
