<!-- Dedicated Birthday Video Surprise Section -->
<section id="video-section" class="py-20 px-4 relative z-20">
    <div class="max-w-4xl mx-auto space-y-10 text-center">
        
        <!-- Header -->
        <div class="space-y-3">
            <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-rose-500/15 border border-rose-400/30 text-rose-300 text-xs font-semibold backdrop-blur">
                <span>🎥✨</span>
                <span class="tracking-widest uppercase font-cinzel">Special Birthday Tape</span>
                <span>💝</span>
            </div>
            <h2 class="font-serif text-3xl sm:text-5xl font-bold text-white">
                A Video Captured With All My Love 🎬
            </h2>
            <p class="text-rose-200/80 text-sm sm:text-base max-w-lg mx-auto">
                Press play to watch our sweet memory reel, recorded straight from the heart.
            </p>
        </div>

        <!-- Cinema Frame Container -->
        <div class="relative mx-auto max-w-md sm:max-w-lg">
            
            <!-- Washi tape at top corners -->
            <div class="absolute -top-3 left-6 w-24 h-6 bg-amber-200/90 shadow-md rotate-[-3deg] z-30"></div>
            <div class="absolute -top-3 right-6 w-24 h-6 bg-rose-300/80 shadow-md rotate-[4deg] z-30"></div>

            <!-- Vintage Cinema Border -->
            <div class="glass-panel p-4 sm:p-6 rounded-3xl border-2 border-amber-300/40 shadow-2xl relative bg-black/60 backdrop-blur-xl">
                
                <!-- Video Container -->
                <div class="relative rounded-2xl overflow-hidden bg-black shadow-2xl aspect-[9/16] max-h-[620px] mx-auto flex items-center justify-center border border-white/10 group">
                    
                    <video id="birthday-fiance-video" 
                           class="w-full h-full object-cover rounded-2xl" 
                           controls 
                           playsinline 
                           preload="metadata" 
                           poster="static/images/cinematic_red_saree.jpg">
                        <source src="static/videos/birthday_video.mp4" type="video/mp4">
                        Your browser does not support HTML5 video playback.
                    </video>

                    <!-- Custom Play Button Overlay (fades out when played) -->
                    <div id="video-play-overlay" class="absolute inset-0 bg-black/40 flex flex-col items-center justify-center space-y-3 cursor-pointer group-hover:bg-black/20 transition-all duration-300">
                        <div class="w-20 h-20 rounded-full bg-gradient-to-r from-rose-500 to-amber-400 p-1 shadow-[0_0_30px_rgba(244,63,94,0.8)] animate-pulse flex items-center justify-center transform group-hover:scale-110 transition">
                            <div class="w-full h-full rounded-full bg-nightLove flex items-center justify-center">
                                <span class="text-3xl text-white ml-1">▶️</span>
                            </div>
                        </div>
                        <span class="text-xs font-cinzel font-bold text-white tracking-widest uppercase bg-black/60 px-3.5 py-1.5 rounded-full border border-white/20 backdrop-blur">
                            Tap to Play Birthday Clip
                        </span>
                    </div>

                    <!-- Cute Corner Doodles & Chibi Sticker -->
                    <div class="absolute bottom-3 left-3 pointer-events-none z-20 flex items-center space-x-2 bg-black/70 px-3 py-1.5 rounded-xl border border-white/20 backdrop-blur">
                        <span class="text-base animate-bounce">✨</span>
                        <span class="text-[10px] font-cursive text-amber-200 text-sm">Vipul & Toshi Forever</span>
                    </div>
                </div>

                <!-- Scrapbook Caption Note -->
                <div class="mt-4 p-4 rounded-2xl bg-nightLove/80 border border-rose-500/20 text-center space-y-1">
                    <p class="font-cursive text-2xl text-rose-300 font-bold">
                        "Every moment with you is my favorite memory."
                    </p>
                    <p class="text-[10px] uppercase tracking-widest font-cinzel text-slate-400 font-semibold">
                        Captured with love • Forever & Always 21 Dec 2026
                    </p>
                </div>
            </div>

            <!-- Cute floating couple doodle artwork sticker on right -->
            <div class="absolute -bottom-6 -right-4 sm:-right-8 w-20 sm:w-24 h-20 sm:h-24 rounded-2xl p-1 bg-white shadow-2xl rotate-6 border border-amber-300 overflow-hidden transform hover:scale-110 transition">
                <img src="static/images/img-20260508-wa0014.jpg" alt="Doodle" class="w-full h-full object-cover rounded-xl">
            </div>

        </div>

    </div>
</section>
