<!-- Cupid's Bow & Arrow Heart Archery Section (Midnight Wine & Rose Gold Theme) -->
<section id="cupid-section" class="py-14 sm:py-20 px-3 sm:px-6 relative z-10 content-lazy-render">
    <div class="max-w-4xl mx-auto space-y-6 sm:space-y-8 text-center">
        
        <div class="space-y-2">
            <span class="text-[10px] uppercase tracking-widest font-cinzel text-amber-300 font-semibold">Cupid's Mission</span>
            <h2 class="font-serif text-2xl xs:text-3xl sm:text-4xl font-bold text-white">Strike {{ fiance_name }}'s Heart 💘</h2>
            <p class="text-rose-200/80 text-xs sm:text-sm max-w-md mx-auto">
                Draw Cupid's golden bow and shoot the love arrow straight into his heart!
            </p>
        </div>

        <!-- Archery Range Box -->
        <div class="glass-panel-gold rounded-2xl sm:rounded-3xl p-4 sm:p-8 border border-amber-300/30 shadow-2xl relative overflow-hidden select-none">
            
            <!-- Archery Track Container -->
            <div id="archery-track" class="relative h-48 sm:h-64 w-full flex items-center justify-between px-2 sm:px-8 select-none">
                
                <!-- Cupid's Bow on Left -->
                <div id="cupid-bow-container" class="relative z-20 flex flex-col items-center">
                    <div id="cupid-bow" class="relative w-14 sm:w-20 h-36 sm:h-48 transition-transform duration-200">
                        <svg viewBox="0 0 100 200" class="w-full h-full drop-shadow-[0_0_8px_rgba(223,188,120,0.6)]">
                            <path d="M 30 10 Q 90 100 30 190" fill="none" stroke="url(#goldGradient)" stroke-width="7" stroke-linecap="round"/>
                            <path id="bow-string" d="M 30 10 L 30 100 L 30 190" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="2,2"/>
                            <defs>
                                <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#fef08a" />
                                    <stop offset="50%" stop-color="#eab308" />
                                    <stop offset="100%" stop-color="#ca8a04" />
                                </linearGradient>
                            </defs>
                        </svg>

                        <!-- The Arrow -->
                        <div id="cupid-arrow" class="absolute top-1/2 left-3 sm:left-5 -translate-y-1/2 flex items-center transition-all duration-100 z-30 pointer-events-none">
                            <div class="w-16 sm:w-28 h-1 bg-gradient-to-r from-amber-400 to-amber-200 rounded-full shadow-[0_0_6px_#fde047]"></div>
                            <div class="w-5 h-5 -ml-1 text-rose-500 transform rotate-45 scale-110">💖</div>
                        </div>
                    </div>
                    <span class="text-[9px] font-cinzel text-amber-300 uppercase tracking-widest mt-1">Cupid</span>
                </div>

                <!-- Trajectory Line -->
                <div class="flex-1 h-0.5 border-b border-dashed border-rose-400/25 mx-2 sm:mx-4 relative hidden sm:block">
                    <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[10px] text-rose-300/40 font-mono tracking-widest">
                        LOVE BEAM
                    </span>
                </div>

                <!-- Heart Target on Right -->
                <div id="heart-target-container" class="relative z-20 flex flex-col items-center">
                    <div id="target-heart" class="relative w-20 sm:w-28 h-20 sm:h-28 flex items-center justify-center transition-all duration-300 cursor-pointer">
                        <div class="absolute inset-0 rounded-full border border-dashed border-amber-300/40 animate-spin" style="animation-duration: 25s;"></div>
                        <div class="text-4xl sm:text-5xl filter drop-shadow-[0_0_15px_rgba(244,63,94,0.7)]">
                            ❤️
                        </div>
                        <span class="absolute -bottom-1 px-2 py-0.5 rounded-full bg-black/70 border border-amber-300/30 text-[8px] sm:text-[9px] font-cinzel font-bold text-amber-200 whitespace-nowrap">
                            {{ fiance_name }}'s Heart
                        </span>
                    </div>
                    <span class="text-[9px] font-cinzel text-rose-300 uppercase tracking-widest mt-2">Target Lock</span>
                </div>

            </div>

            <!-- Shoot Control -->
            <div class="pt-4 border-t border-amber-400/20 flex flex-col sm:flex-row items-center justify-center gap-3">
                <button type="button" id="shoot-arrow-btn" class="w-full sm:w-auto px-7 py-3 rounded-full bg-gradient-to-r from-amber-400 via-rose-500 to-rose-600 text-white font-bold text-xs sm:text-sm shadow-xl shadow-rose-600/30 transition transform active:scale-95 flex items-center justify-center space-x-1.5">
                    <span>🏹</span>
                    <span>Shoot Cupid's Arrow into His Heart!</span>
                </button>

                <button type="button" id="reset-arrow-btn" class="hidden px-5 py-2.5 rounded-full glass-panel text-xs text-rose-200 font-medium transition">
                    🔄 Shoot Again
                </button>
            </div>

            <!-- Hit Announcement -->
            <div id="bullseye-msg" class="hidden mt-4 p-4 rounded-xl bg-slate-900/90 border border-rose-400/40 text-center space-y-2">
                <div class="w-16 h-16 mx-auto rounded-xl overflow-hidden border border-rose-400">
                    <img src="https://media.tenor.com/9tO-go2PlNwAAAAM/bubu-dudu-love.gif" alt="Target Hit" class="w-full h-full object-cover">
                </div>
                <h4 class="font-serif text-lg font-bold text-white">DIRECT HIT! 🎯❤️</h4>
                <p class="text-xs text-rose-100 max-w-sm mx-auto">
                    {{ fiance_name }}'s heart is 100% captured by Toshi forever and ever!
                </p>
            </div>

        </div>

    </div>
</section>
