<!-- Countdown Section (Midnight Wine & Rose Gold Theme) -->
<section id="countdown-section" class="py-10 sm:py-12 px-3 sm:px-4 relative z-20">
    <div class="max-w-3xl mx-auto">
        <div class="glass-panel-gold rounded-3xl p-6 sm:p-8 border border-amber-300/35 text-center relative overflow-hidden shadow-2xl">
            <!-- Decorative ambient glow -->
            <div class="absolute -top-10 -right-10 w-28 h-28 bg-rose-500/15 rounded-full blur-xl pointer-events-none"></div>
            <div class="absolute -bottom-10 -left-10 w-28 h-28 bg-amber-500/10 rounded-full blur-xl pointer-events-none"></div>

            <p id="countdown-banner" class="text-xs sm:text-sm font-cinzel uppercase tracking-widest text-amber-300 mb-2 font-bold">
                ⏳ Counting Down to 16 November • Celebrating My Handsome Boy
            </p>
            <div class="inline-flex items-center space-x-1.5 px-3.5 py-1 rounded-full bg-rose-500/20 border border-rose-400/30 text-rose-200 text-xs mb-5 font-cursive font-bold shadow-sm">
                <span>Next Milestone: 21 Dec 2026 • Our Forever Wedding Day 💍🥂</span>
            </div>

            <div class="grid grid-cols-4 gap-2.5 sm:gap-5 max-w-xl mx-auto">
                <!-- Days -->
                <div class="p-3 sm:p-5 rounded-2xl bg-black/45 border border-rose-500/25 shadow-inner">
                    <span id="count-days" class="block font-serif text-3xl sm:text-5xl font-black text-white">00</span>
                    <span class="text-[10px] sm:text-xs uppercase tracking-wider text-rose-300/80 font-cinzel font-bold">Days</span>
                </div>
                <!-- Hours -->
                <div class="p-3 sm:p-5 rounded-2xl bg-black/45 border border-rose-500/25 shadow-inner">
                    <span id="count-hours" class="block font-serif text-3xl sm:text-5xl font-black text-white">00</span>
                    <span class="text-[10px] sm:text-xs uppercase tracking-wider text-rose-300/80 font-cinzel font-bold">Hours</span>
                </div>
                <!-- Minutes -->
                <div class="p-3 sm:p-5 rounded-2xl bg-black/45 border border-rose-500/25 shadow-inner">
                    <span id="count-mins" class="block font-serif text-3xl sm:text-5xl font-black text-white">00</span>
                    <span class="text-[10px] sm:text-xs uppercase tracking-wider text-rose-300/80 font-cinzel font-bold">Minutes</span>
                </div>
                <!-- Seconds -->
                <div class="p-3 sm:p-5 rounded-2xl bg-black/45 border border-rose-500/25 shadow-inner">
                    <span id="count-secs" class="block font-serif text-3xl sm:text-5xl font-black text-amber-300">00</span>
                    <span class="text-[10px] sm:text-xs uppercase tracking-wider text-amber-300/80 font-cinzel font-bold">Seconds</span>
                </div>
            </div>

            <p class="text-xs text-rose-200/70 mt-4 italic font-medium">
                Every second brings us closer to celebrating you in the sweetest way!
            </p>
        </div>
    </div>
</section>
