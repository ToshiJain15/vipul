<!-- Countdown Section -->
<section id="countdown-section" class="py-12 px-4 relative z-20">
    <div class="max-w-3xl mx-auto">
        <div class="glass-panel-gold rounded-3xl p-6 sm:p-10 border border-amber-300/30 text-center relative overflow-hidden">
            <!-- Decorative corner accents -->
            <div class="absolute -top-10 -right-10 w-28 h-28 bg-amber-400/10 rounded-full blur-xl pointer-events-none"></div>
            <div class="absolute -bottom-10 -left-10 w-28 h-28 bg-rose-500/10 rounded-full blur-xl pointer-events-none"></div>

            <p id="countdown-banner" class="text-xs sm:text-sm font-cinzel uppercase tracking-widest text-amber-300/90 mb-4 font-semibold">
                ⏳ Counting Down to Celebrating You
            </p>

            <div class="grid grid-cols-4 gap-3 sm:gap-6 max-w-xl mx-auto">
                <!-- Days -->
                <div class="bg-black/40 rounded-2xl p-3 sm:p-5 border border-amber-400/20 shadow-inner">
                    <span id="count-days" class="block font-serif text-3xl sm:text-5xl font-bold text-amber-200">00</span>
                    <span class="text-[10px] sm:text-xs uppercase tracking-wider text-rose-300/70 font-medium">Days</span>
                </div>
                <!-- Hours -->
                <div class="bg-black/40 rounded-2xl p-3 sm:p-5 border border-amber-400/20 shadow-inner">
                    <span id="count-hours" class="block font-serif text-3xl sm:text-5xl font-bold text-amber-200">00</span>
                    <span class="text-[10px] sm:text-xs uppercase tracking-wider text-rose-300/70 font-medium">Hours</span>
                </div>
                <!-- Minutes -->
                <div class="bg-black/40 rounded-2xl p-3 sm:p-5 border border-amber-400/20 shadow-inner">
                    <span id="count-mins" class="block font-serif text-3xl sm:text-5xl font-bold text-amber-200">00</span>
                    <span class="text-[10px] sm:text-xs uppercase tracking-wider text-rose-300/70 font-medium">Minutes</span>
                </div>
                <!-- Seconds -->
                <div class="bg-black/40 rounded-2xl p-3 sm:p-5 border border-amber-400/20 shadow-inner">
                    <span id="count-secs" class="block font-serif text-3xl sm:text-5xl font-bold text-rose-400">00</span>
                    <span class="text-[10px] sm:text-xs uppercase tracking-wider text-rose-300/70 font-medium">Seconds</span>
                </div>
            </div>

            <p class="text-xs text-rose-200/60 mt-4 italic">
                Every second brings us closer to making this birthday the most memorable one yet!
            </p>
        </div>
    </div>
</section>
