<!-- Countdown Section (Red & White Theme) -->
<section id="countdown-section" class="py-10 sm:py-12 px-3 sm:px-4 relative z-20">
    <div class="max-w-3xl mx-auto">
        <div class="bg-white/95 rounded-3xl p-6 sm:p-8 border-2 border-rose-200 text-center relative overflow-hidden shadow-xl">
            <!-- Decorative soft blush accents -->
            <div class="absolute -top-10 -right-10 w-28 h-28 bg-red-100/60 rounded-full blur-xl pointer-events-none"></div>
            <div class="absolute -bottom-10 -left-10 w-28 h-28 bg-rose-100/60 rounded-full blur-xl pointer-events-none"></div>

            <p id="countdown-banner" class="text-xs sm:text-sm font-cinzel uppercase tracking-widest text-red-700 mb-2 font-bold">
                ⏳ Counting Down to 16 November • Celebrating My Handsome Boy
            </p>
            <div class="inline-flex items-center space-x-1.5 px-3.5 py-1 rounded-full bg-red-50 border border-red-200 text-red-700 text-xs mb-5 font-cursive font-bold shadow-sm">
                <span>Next Milestone: 21 Dec 2026 • When Distance Becomes 0.00 KM Forever 💍</span>
            </div>

            <div class="grid grid-cols-4 gap-2.5 sm:gap-5 max-w-xl mx-auto">
                <!-- Days -->
                <div class="bg-rose-50/70 rounded-2xl p-3 sm:p-5 border border-rose-200 shadow-sm">
                    <span id="count-days" class="block font-serif text-3xl sm:text-5xl font-black text-red-600">00</span>
                    <span class="text-[10px] sm:text-xs uppercase tracking-wider text-slate-600 font-bold">Days</span>
                </div>
                <!-- Hours -->
                <div class="bg-rose-50/70 rounded-2xl p-3 sm:p-5 border border-rose-200 shadow-sm">
                    <span id="count-hours" class="block font-serif text-3xl sm:text-5xl font-black text-red-600">00</span>
                    <span class="text-[10px] sm:text-xs uppercase tracking-wider text-slate-600 font-bold">Hours</span>
                </div>
                <!-- Minutes -->
                <div class="bg-rose-50/70 rounded-2xl p-3 sm:p-5 border border-rose-200 shadow-sm">
                    <span id="count-mins" class="block font-serif text-3xl sm:text-5xl font-black text-red-600">00</span>
                    <span class="text-[10px] sm:text-xs uppercase tracking-wider text-slate-600 font-bold">Minutes</span>
                </div>
                <!-- Seconds -->
                <div class="bg-rose-50/70 rounded-2xl p-3 sm:p-5 border border-rose-200 shadow-sm">
                    <span id="count-secs" class="block font-serif text-3xl sm:text-5xl font-black text-rose-500">00</span>
                    <span class="text-[10px] sm:text-xs uppercase tracking-wider text-slate-600 font-bold">Seconds</span>
                </div>
            </div>

            <p class="text-xs text-slate-500 mt-4 italic font-medium">
                Every second brings us closer to celebrating you in the sweetest way!
            </p>
        </div>
    </div>
</section>
